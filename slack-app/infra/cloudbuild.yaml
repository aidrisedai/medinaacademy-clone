steps:
  # ─── Build Frontend ────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '--file=infra/Dockerfile.frontend'
      - '--tag=gcr.io/$PROJECT_ID/slackapp-frontend:$COMMIT_SHA'
      - '--tag=gcr.io/$PROJECT_ID/slackapp-frontend:latest'
      - '--build-arg=VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg=VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg=VITE_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg=VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '.'

  # ─── Build Backend ─────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '--file=infra/Dockerfile.backend'
      - '--tag=gcr.io/$PROJECT_ID/slackapp-backend:$COMMIT_SHA'
      - '--tag=gcr.io/$PROJECT_ID/slackapp-backend:latest'
      - '.'

  # ─── Push Images ───────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', 'gcr.io/$PROJECT_ID/slackapp-frontend:$COMMIT_SHA']
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', 'gcr.io/$PROJECT_ID/slackapp-backend:$COMMIT_SHA']
    waitFor: ['build-backend']

  # ─── Deploy Backend to Cloud Run ───────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'slackapp-backend'
      - '--image=gcr.io/$PROJECT_ID/slackapp-backend:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=4000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=60'
      - '--set-env-vars=NODE_ENV=production,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - '--set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest'
    waitFor: ['push-backend']

  # ─── Deploy Frontend to Cloud Run ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'slackapp-frontend'
      - '--image=gcr.io/$PROJECT_ID/slackapp-frontend:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--concurrency=200'
    waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/slackapp-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/slackapp-frontend:latest'
  - 'gcr.io/$PROJECT_ID/slackapp-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/slackapp-backend:latest'

substitutions:
  _REGION: us-central1
  _FIREBASE_PROJECT_ID: your-firebase-project-id
  _FIREBASE_AUTH_DOMAIN: your-project.firebaseapp.com
  _FIREBASE_STORAGE_BUCKET: your-project.appspot.com
  _FIREBASE_API_KEY: ''
  _FIREBASE_MESSAGING_SENDER_ID: ''
  _FIREBASE_APP_ID: ''

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
